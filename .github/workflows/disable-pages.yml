name: Desativar GitHub Pages

on:
  push:
    paths:
      - ".github/workflows/disable-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  disable:
    name: Desativar publicação
    runs-on: ubuntu-latest
    steps:
      - name: Remover site do GitHub Pages
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.request("DELETE /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.info("GitHub Pages desativado com sucesso.");
            } catch (error) {
              if (error.status === 404) {
                core.notice("O GitHub Pages já estava desativado.");
                return;
              }
              throw error;
            }
